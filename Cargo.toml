[package]
name = "macfan"
version = "0.1.0"
edition = "2024"
description = "Fan control and sensor monitor for Intel Macs running Windows (Boot Camp)"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
libloading = "0.9.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = 3
lto = true
strip = true
